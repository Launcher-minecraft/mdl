<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Planif Révisions</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
</head>
<body>
  <main class="app">
    <header class="hero card gradient">
      <p class="badge">Mobile • Productif</p>
      <h1>Planificateur de révision</h1>
      <p class="subtitle">Ton plan auto en 30 secondes : matière, date d’examen, chapitres.</p>
      <div class="stats" id="stats"></div>
    </header>

    <section class="card">
      <h2>Créer une matière</h2>
      <form id="subject-form" class="stack">
        <label>
          Matière
          <input type="text" id="subject-name" placeholder="Ex : Maths" required maxlength="40">
        </label>
        <div class="row two-cols">
          <label>
            Date de l'examen
            <input type="date" id="exam-date" required>
          </label>
          <label>
            Priorité
            <select id="priority">
              <option value="normale">Normale</option>
              <option value="haute">Haute</option>
            </select>
          </label>
        </div>
        <label>
          Chapitres à réviser
          <textarea id="chapters" rows="4" placeholder="1 chapitre par ligne" required></textarea>
        </label>
        <button type="submit" class="primary">Créer le planning</button>
      </form>
      <p id="form-msg" class="msg" role="status"></p>
    </section>

    <section class="card">
      <div class="row">
        <h2>Aujourd'hui</h2>
        <span id="today-date" class="chip"></span>
      </div>
      <ul id="today-list" class="task-list"></ul>
      <p id="today-empty" class="empty">Aucune tâche aujourd'hui ✅</p>
    </section>

    <section class="card">
      <h2>Prochaines révisions (7 jours)</h2>
      <div id="future-list" class="future"></div>
      <p id="future-empty" class="empty">Ajoute une matière pour générer ton plan.</p>
    </section>

    <section class="card">
      <div class="row">
        <h2>Matières enregistrées</h2>
        <button id="reset-btn" class="danger" type="button">Tout effacer</button>
      </div>
      <ul id="subject-list" class="subject-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
